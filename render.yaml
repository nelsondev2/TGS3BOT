# Render deployment config - Telegram S3 Bot
# https://render.com/docs/blueprint-spec
#
# Importante:
# - El plan free no permite discos persistentes. La sesión de Telethon se
#   pierde en cada deploy; usa TG_SESSION_STRING (generado con
#   scripts/generate_bot_session.py) para no repetir el login.
# - Un Web Service free se suspende tras 15 min sin tráfico HTTP. Si lo usas,
#   necesitas un ping externo o un plan siempre encendido.
# - Para archivos grandes necesitas un disco con espacio suficiente:
#   descomenta el bloque "disk" y usa un plan de pago.

services:
  - type: web
    name: telegram-s3-bot
    runtime: python
    region: oregon  # ajusta según tu región preferida
    plan: free  # free, starter, standard, pro
    branch: main
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    # Render inyecta automáticamente PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # === Telegram (obligatorio) ===
      - key: TG_API_ID
        sync: false  # https://my.telegram.org/apps
      - key: TG_API_HASH
        sync: false
      # Modo bot:
      - key: TG_BOT_TOKEN
        sync: false  # créalo con @BotFather
      # O modo userbot / sesión persistente (tiene prioridad):
      - key: TG_SESSION_STRING
        sync: false
      # === Seguridad ===
      - key: ALLOWED_TG_IDS
        # CSV de IDs autorizados, ej: "123456789,987654321". Vacío = todos.
        sync: false
      - key: SSRF_BLOCK_PRIVATE
        value: "1"
      # === S3 (toDus por defecto) ===
      - key: S3_ENDPOINT
        value: "https://s3.todus.cu"
      - key: S3_BUCKET
        value: "stream"
      - key: S3_UNSIGNED
        value: "1"
      # === Comportamiento ===
      - key: MAX_FILE_SIZE_MB
        value: "0"  # 0 = sin límite del bot (Telegram impone el suyo)
      - key: TG_UPLOAD_LIMIT_MB
        value: "0"  # 0 = sin comprobación previa
      - key: DOWNLOAD_TIMEOUT_SECONDS
        value: "3600"
      - key: UPLOAD_TIMEOUT_SECONDS
        value: "3600"
      - key: PARALLEL_URL_DOWNLOAD
        value: "1"
      - key: WATCHDOG_ENABLED
        value: "1"
      - key: WATCHDOG_LIFETIME
        value: "14100"
      - key: LOG_LEVEL
        value: "INFO"
      - key: SEND_FILE_VIA_TG
        value: "0"  # "1" = reenviar archivo + URL (gasta datos)
    # Disco persistente: solo en planes de pago.
    # Ajusta sizeGB al tamaño máximo que quieras manejar (deja margen).
    # disk:
    #   name: tmp-downloads
    #   mountPath: /tmp/tg_uploads
    #   sizeGB: 5
