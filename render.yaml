# Render deployment config - Telegram S3 Bot
# https://render.com/docs/blueprint-spec
# Crea este servicio en Render como "Web Service" usando "Python" o "Docker".

services:
  - type: web
    name: telegram-s3-bot
    runtime: python
    # Alternativa: runtime: docker (usando el Dockerfile incluido)
    region: oregon  # ajusta según tu región preferida
    plan: free  # free, starter, standard, pro
    branch: main
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    healthCheckTimeout: 60
    autoDeploy: true
    # Render inyecta automáticamente la variable PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # === Telegram (obligatorio) ===
      - key: TG_API_ID
        sync: false  # setea en panel: https://my.telegram.org/apps
      - key: TG_API_HASH
        sync: false
      # Modo bot:
      - key: TG_BOT_TOKEN
        sync: false  # créalo con @BotFather
      # O modo userbot (uno de los dos):
      - key: TG_SESSION_STRING
        sync: false
      # === Seguridad ===
      - key: ALLOWED_TG_IDS
        # CSV de IDs autorizados, ej: "123456789,987654321"
        sync: false
      - key: SSRF_BLOCK_PRIVATE
        value: "1"
      # === S3 (toDus por defecto) ===
      - key: S3_ENDPOINT
        value: "https://s3.todus.cu"
      - key: S3_BUCKET
        value: "stream"
      - key: S3_UNSIGNED
        value: "1"
      - key: S3_KEY_PREFIXES
        # Namespaces CANDIDATOS en orden (medido con scripts/probe_todus.py
        # el 2026-10-27): hi/ es hoy el más sólido, users/df/ muere a los
        # 10-18 min y dk/ cayó por completo. El bot sube a S3_MIRRORS de
        # ellos (principal + espejo) y recuerda cuál sobrevive.
        # Keys resultantes: <prefijo>/<user_id>/<nombre>_<rand>.<ext>
        value: "hi,users/df,dk/tg_{user_id}"
      - key: S3_MIRRORS
        # A cuántos namespaces subir cada archivo (principal + espejos)
        value: "2"
      - key: S3_SETTLE_SECONDS
        # Espera anti-barrido antes de entregar el enlace (segundos)
        value: "150"
      - key: S3_DELIVER_FAST
        # "1" = entregar el enlace en cuanto pasa la 1ª verificación;
        # un guardián vigila el settle en segundo plano y edita el
        # mensaje si el barrido borra alguna copia. "0" = esperar todo
        # el settle antes de entregar nada (clásico, más lento).
        value: "1"
      # NOTA: ya no se usa S3_KEY_PREFIX (singular). Si tu servicio lo
      # tenía en "users" o "users/df", el código lo interpreta como
      # "lista por defecto" por compatibilidad; puedes borrar la var.
      - key: S3_VERIFY_UPLOAD
        # "1" = comprobar con HEAD que el objeto existe antes de entregar el enlace
        value: "1"
      - key: S3_UPLOAD_RETRIES
        value: "3"
      # === Comportamiento ===
      - key: MAX_FILE_SIZE_MB
        value: "2000"
      - key: PARALLEL_URL_DOWNLOAD
        value: "1"
      - key: WATCHDOG_ENABLED
        value: "1"
      - key: WATCHDOG_LIFETIME
        value: "14100"
      - key: LOG_LEVEL
        value: "INFO"
      - key: ALWAYS_SHOW_S3_URL
        value: "1"
      - key: SEND_FILE_VIA_TG
        # Por defecto "0" = solo URL S3 (ahorra datos en toDus)
        # "1" = reenviar archivo + URL S3
        value: "0"
      # === ToDus oficial (ToDus-SDK) ===
      # La vía anónima depende de namespaces que el barrido de toDus va
      # tumbando sin aviso. La OFICIAL reserva cada subida con una
      # cuenta de toDus (todus:purl) y el objeto queda registrado.
      # Login desde el bot: /toduslogin (SMS). Las credenciales se
      # guardan en el disco (DOWNLOAD_PATH/todus_credentials.json);
      # si el disco no persiste, usa TODUS_PHONE/TODUS_PASSWORD.
      - key: TODUS_UPLOAD_MODE
        # auto = oficial si hay cuenta y anónima si no/falla | anonymous = nunca SDK
        value: "auto"
      - key: TODUS_PHONE
        # Número cubano (53XXXXXXXX) de la cuenta de toDus del bot (opcional)
        sync: false
      - key: TODUS_PASSWORD
        # Contraseña/secreto de esa cuenta (opcional; /toduslogin la obtiene por SMS)
        sync: false
      - key: TODUS_PERSISTENT
        # "1" = pedir la reserva como persistente (cae solo a false si el server la rechaza)
        value: "1"
      - key: ADMIN_TG_IDS
        # CSV de IDs que pueden usar /toduslogin en MODO BOT (en userbot, solo el dueño)
        sync: false
    disk:
      # Disco efímero para descargas temporales
      name: tmp-downloads
      mountPath: /tmp/tg_uploads
      sizeGB: 1
